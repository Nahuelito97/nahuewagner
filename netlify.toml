# Netlify configuration — see https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

# Netlify usa esta variable para elegir el runtime de build. Tiene que coincidir
# con .nvmrc y con "engines" en package.json: @netlify/functions v6 exige >=22.12.
[build.environment]
  NODE_VERSION = "22"

# El formulario de contacto lo atiende netlify/functions/contact.mts (runtime Node,
# no Edge: la plantilla usa React Email y necesita react-dom/server).
#
# La función ya declara su ruta con `export const config = { path: '/api/contact' }`,
# pero esta regla va igual y va PRIMERO: las reglas se evalúan en orden y el
# comodín /* de abajo, si se evaluara antes, se tragaría /api/contact y devolvería
# el index.html en vez de ejecutar la función.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# SPA fallback: client-side routes serve the built index.html so deep links work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
